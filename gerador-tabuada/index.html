<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativo</title>
</head>

<body>

    <h1>Gerador de Tabuada Interativo</h1>

    <label for="numero">Digite um número de 1 a 100:</label>

    <input type="number" id="numero" min="1" max="10">

    <button id="gerar">Gerar Tabuada</button>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>

</html>
